# Local stack: PostgreSQL (with the pgvector extension available) + the backend API.
#   cp .env.example .env   # then set AUTH_SECRET
#   docker compose up --build
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: adaptive_learning
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d adaptive_learning"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    env_file: .env
    environment:
      # Overrides any DATABASE_URL in .env: inside the compose network the database is reached
      # by service name, not localhost.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/adaptive_learning
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      # Uploaded study material. Without this, files vanish when the container is recreated
      # while their rows survive in postgres_data, breaking "View source".
      - documents_data:/app/var/documents
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  documents_data:
