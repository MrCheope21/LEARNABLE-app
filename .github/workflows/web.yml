name: Web

# The browser client (web/). Never needs paid AI: unit tests mock the API, and the browser
# end-to-end job runs a real backend with the deterministic MockAIProvider.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "backend/app/**"
      - "backend/scripts/export_openapi.py"
      - "backend/scripts/seed_demo.py"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "backend/app/**"
      - "backend/scripts/export_openapi.py"
      - "backend/scripts/seed_demo.py"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install
        run: |
          npm ci
          pip install -r ../backend/requirements.lock

      - name: API types match the backend
        # The web client is typed from the backend's OpenAPI schema. Regenerate both and fail on
        # any difference, so a backend change can't silently break the browser client.
        run: |
          python ../backend/scripts/export_openapi.py openapi.json
          npm run gen:api
          git diff --exit-code -- openapi.json src/api/schema.d.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: No AI credentials in the browser bundle
        run: npm run check:secrets

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_PROVIDER: mock
      AUTH_SECRET: web-e2e-only-not-a-real-secret-0123456789abcdef
      DATABASE_URL: sqlite:///${{ github.workspace }}/backend/web-e2e.db
      STORAGE_LOCAL_DIR: ${{ github.workspace }}/backend/var/documents
      CI: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Backend (mock AI, demo seed)
        working-directory: backend
        run: |
          pip install -r requirements.lock
          python -m alembic upgrade head
          python scripts/seed_demo.py
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && exit 0; sleep 1; done
          cat backend.log
          exit 1

      - name: Install web and browser
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Browser end-to-end
        working-directory: web
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e
          path: |
            web/playwright-report
            web/test-results
            backend/backend.log
