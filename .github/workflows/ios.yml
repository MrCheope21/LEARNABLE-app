name: iOS

# macOS runners bill at a high multiplier on private repos, so this only runs when iOS code
# changes, cancels superseded runs, and has a hard timeout.
on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "!ios/**/*.md"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "!ios/**/*.md"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      e2e:
        description: "Also run the end-to-end acceptance test against a seeded backend"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ios

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an available iPhone simulator
        id: simulator
        # Simulator names change with every Xcode release, so pick one at runtime instead of
        # hard-coding e.g. "iPhone 16". Prefers the newest iOS runtime.
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if ".iOS-" not in runtime:
                  continue
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      sys.exit(0)
          sys.exit("no iPhone simulator available")
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          xcodebuild test \
            -project AdaptiveLearning.xcodeproj \
            -scheme AdaptiveLearning \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log
          exit "${PIPESTATUS[0]}"

      - name: Summarize failures
        if: failure()
        # The full log is megabytes; surface compiler errors and failed assertions first.
        run: |
          grep -E "error:|warning: .*(deprecated|unused)|failed \(|XCTAssert|Test Case .* failed" xcodebuild.log | sort -u | head -300 || true

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log
          path: ios/xcodebuild.log

  # The MVP vertical slice on a simulator against a real backend (docs/PROJECT_STATUS.md,
  # "END-TO-END PASS"). Manual only (slow, bills macOS minutes). The backend runs the
  # deterministic mock AI provider and the demo seed: no API key, no network model.
  acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    runs-on: macos-15
    timeout-minutes: 45
    env:
      AI_PROVIDER: mock
      AUTH_SECRET: e2e-only-not-a-real-secret-0123456789abcdef
      DATABASE_URL: sqlite:///${{ github.workspace }}/backend/e2e.db
      STORAGE_LOCAL_DIR: ${{ github.workspace }}/backend/var/documents

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.lock

      - name: Migrate and seed
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python scripts/seed_demo.py

      - name: Start backend
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          cat backend.log
          exit 1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Pick an available iPhone simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if ".iOS-" not in runtime:
                  continue
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      sys.exit(0)
          sys.exit("no iPhone simulator available")
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # Signed ad hoc ("Sign to Run Locally"), not unsigned like the unit-test job: an unsigned
      # app has no Keychain entitlement on the simulator, so storing the sign-in token fails.
      - name: Run acceptance test
        working-directory: ios
        run: |
          xcodebuild test \
            -project AdaptiveLearning.xcodeproj \
            -scheme AdaptiveLearningE2E \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath e2e.xcresult \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            | tee xcodebuild.log
          exit "${PIPESTATUS[0]}"

      - name: Summarize failures
        if: failure()
        working-directory: ios
        run: |
          grep -E "ACCEPTANCE (STEP|COMPLETE)" xcodebuild.log | tail -3 || true
          grep -E "error:|Timed out waiting|not hittable|XCTAssert|Test Case .* failed" xcodebuild.log | sort -u | head -200 || true
          echo "---- backend log (tail) ----"
          tail -100 ../backend/backend.log || true

      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: |
            ios/e2e.xcresult
            ios/xcodebuild.log
            backend/backend.log
