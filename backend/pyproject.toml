[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "I",  # pycodestyle, pyflakes, import order
    "B",            # bugbear: likely bugs
    "S",            # bandit: security (e.g. hard-coded secrets, unsafe calls)
    "UP",           # pyupgrade: modern syntax for the target Python
    "SIM",          # simplifications
    "C4",           # comprehensions
    "PT",           # pytest style
    "RUF",          # ruff-specific checks
]
ignore = [
    # FastAPI's dependency-injection idiom is `param = Depends(...)` in the signature.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and use fixed fake credentials on purpose.
"tests/**" = ["S101", "S105", "S106"]
# Generated by Alembic, then auto-formatted by the post-write hook.
"migrations/versions/**" = ["UP035", "UP007"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "migrations/env.py"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
# boto3 ships no type information; only app/storage uses it, behind DocumentStorage.
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true
